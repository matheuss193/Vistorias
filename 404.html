/* ---------------- nomes das fotos (iguais aos do app antigo, para importar no sistema oficial) ---------------- */
function nomesFotos(v) { var base = 'Vistoria' + (limpaNome(v.S.f && v.S.f.razao) ? ' ' + limpaNome(v.S.f.razao) : ''), cont = {}; return v.fotos.map(function (r) { var o = limpaNome(r.nome) || 'Geral', k = base + '|' + o.toLowerCase(); cont[k] = (cont[k] || 0) + 1; return { r: r, nome: base + ' (' + o + ')' + (cont[k] > 1 ? ' ' + cont[k] : '') + '.jpg' }; }); }
function csvFotos(l) { var q = function (x) { return '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"'; }; var rows = [['arquivo', 'o_que_foi_fotografado', 'legenda', 'data_hora']]; l.forEach(function (a) { rows.push([a.nome, a.r.nome, a.r.cap, dtTxt(a.r.ts)]); }); return '\ufeff' + rows.map(function (x) { return x.map(q).join(';'); }).join('\r\n'); }

/* ---------------- salvar ---------------- */
function baixar(blob, nome) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 6000); }
async function pegarPasta() { if (ST.modoZip || !window.showDirectoryPicker) return null; if (ST.pasta) return ST.pasta; try { ST.pasta = await window.showDirectoryPicker({ mode: 'readwrite' }); return ST.pasta; } catch (e) { if (e && e.name === 'AbortError') throw e; return null; } }
async function gravar(dir, caminho, nome, blob) { var d = dir; for (var i = 0; i < caminho.length; i++) d = await d.getDirectoryHandle(caminho[i], { create: true }); var fh = await d.getFileHandle(nome, { create: true }); var w = await fh.createWritable(); await w.write(blob); await w.close(); var f = await fh.getFile(); return f.size === blob.size && blob.size > 0; }
function msg(id, t, ok) { var e = $(id); if (e) { e.textContent = t; e.className = 's' + (ok ? ' ok' : ''); } }
function ocupado(b) { ['bPdf', 'bFotos'].forEach(function (id) { var e = $(id); if (e) e.disabled = b; }); }
async function salvarPdfs() {
  ocupado(true); msg('sPdf', 'Gerando os PDFs…');
  try {
    var arq = []; for (var i = 0; i < VIS.length; i++) { if (VIS[i].soSoltas) continue; arq.push({ nome: VIS[i].base + '.pdf', blob: await pdfDaVistoria(VIS[i]) }); }
    if (!arq.length) { ST.pdf = 'nada'; msg('sPdf', 'Não há vistorias com dados para gerar PDF.', true); return depois(); }
    var dir = await pegarPasta();
    if (dir) { var oks = 0; for (var j = 0; j < arq.length; j++) { if (await gravar(dir, ['Relatorios'], arq[j].nome, arq[j].blob)) oks++; } if (oks === arq.length) { ST.pdf = 'ok'; ST.verificado.pdf = true; msg('sPdf', '✔ ' + oks + ' PDF(s) salvo(s) na pasta “' + dir.name + '/Relatorios”.', true); } else { msg('sPdf', 'Só ' + oks + ' de ' + arq.length + ' PDF(s) foram gravados. Tente de novo.'); } }
    else if (navigator.canShare && !ST.modoZip && navigator.canShare({ files: arq.map(function (a) { return new File([a.blob], a.nome, { type: 'application/pdf' }); }) })) {
      await navigator.share({ files: arq.map(function (a) { return new File([a.blob], a.nome, { type: 'application/pdf' }); }), title: 'Vistorias (PDF)' }); ST.pdf = 'ok'; msg('sPdf', '✔ ' + arq.length + ' PDF(s) enviados para salvar. Confira onde ficaram.', true);
    } else { arq.forEach(function (a, i) { setTimeout(function () { baixar(a.blob, a.nome); }, i * 700); }); ST.pdf = 'ok'; msg('sPdf', '✔ ' + arq.length + ' PDF(s) baixado(s) para a pasta Downloads. Confira o aparelho.', true); }
  } catch (e) { if (e && e.name === 'AbortError') msg('sPdf', 'Cancelado. Toque de novo quando quiser.'); else msg('sPdf', 'Não foi possível salvar: ' + (e.message || e)); }
  ocupado(false); depois();
}
async function salvarFotos() {
  ocupado(true); msg('sFotos', 'Preparando as fotos…');
  try {
    var com = VIS.filter(function (v) { return v.fotos.length; });
    if (!com.length) { ST.fotos = 'nada'; msg('sFotos', 'Não há fotos neste aparelho.', true); return depois(); }
    var dir = await pegarPasta(), total = 0, okTotal = 0;
    if (dir) {
      for (var i = 0; i < com.length; i++) { var l = nomesFotos(com[i]); for (var j = 0; j < l.length; j++) { total++; if (await gravar(dir, ['Fotos', com[i].base], l[j].nome, l[j].r.blob)) okTotal++; msg('sFotos', 'Salvando… ' + okTotal + ' de ' + total); } total++; if (await gravar(dir, ['Fotos', com[i].base], 'LEGENDAS.csv', new Blob([csvFotos(l)], { type: 'text/csv' }))) okTotal++; }
      if (okTotal === total) { ST.fotos = 'ok'; ST.verificado.fotos = true; msg('sFotos', '✔ ' + (total - com.length) + ' foto(s) salva(s) como arquivos separados na pasta “' + dir.name + '/Fotos”.', true); } else msg('sFotos', 'Só ' + okTotal + ' de ' + total + ' arquivos foram gravados. Tente de novo.');
    } else {
      for (var a = 0; a < com.length; a++) { var l2 = nomesFotos(com[a]), it = []; for (var b = 0; b < l2.length; b++) it.push({ nome: l2[b].nome, dados: new Uint8Array(await l2[b].r.blob.arrayBuffer()) }); it.push({ nome: 'LEGENDAS.csv', dados: new TextEncoder().encode(csvFotos(l2)) }); (function (z, nome, d) { setTimeout(function () { baixar(z, nome); }, d); })(montarZip(it), com[a].base + ' - fotos.zip', a * 900); total += l2.length; }
      ST.fotos = 'ok'; msg('sFotos', '✔ ' + total + ' foto(s) baixada(s) em ' + com.length + ' arquivo(s) ZIP (as imagens ficam soltas dentro dele, com o nome de sempre). Abra o ZIP e extraia as fotos.', true);
    }
  } catch (e) { if (e && e.name === 'AbortError') msg('sFotos', 'Cancelado. Toque de novo quando quiser.'); else msg('sFotos', 'Não foi possível salvar: ' + (e.message || e)); }
  ocupado(false); depois();
}

/* ---------------- encerrar e apagar ---------------- */
var cont = null;
function precisa() { var p = VIS.some(function (v) { return !v.soSoltas; }), f = VIS.some(function (v) { return v.fotos.length; }); return { pdf: p, fotos: f }; }
function depois() {
  var n = precisa(), pdfOk = !n.pdf || ST.pdf, fotosOk = !n.fotos || ST.fotos;
  if (!(pdfOk && fotosOk)) return;
  var verif = (!n.pdf || ST.verificado.pdf) && (!n.fotos || ST.verificado.fotos);
  var el = $('fim'); el.style.display = 'block';
  if (verif) { var s = 8; el.innerHTML = '<div class="n">Tudo salvo e conferido. Este aparelho será <b>encerrado e os dados antigos apagados</b> em <b id="seg">' + s + '</b> s.</div><button class="b" id="bCanc">Cancelar</button>'; $('bCanc').onclick = function () { clearInterval(cont); el.innerHTML = '<button class="b vm" id="bApaga">Encerrar e apagar os dados deste aparelho</button>'; $('bApaga').onclick = apagarTudo; };
    cont = setInterval(function () { s--; var e = $('seg'); if (e) e.textContent = s; if (s <= 0) { clearInterval(cont); apagarTudo(); } }, 1000); }
  else { el.innerHTML = '<div class="n">Confira no aparelho se os arquivos foram salvos (PDF e fotos). Depois toque abaixo para <b>encerrar e apagar os dados antigos</b> deste aparelho. Isto não pode ser desfeito.</div><button class="b vm" id="bApaga">Já conferi: encerrar e apagar os dados</button>'; $('bApaga').onclick = apagarTudo; }
}
async function apagarTudo() {
  var area = $('area'); area.innerHTML = '<p><small>Apagando os dados antigos deste aparelho…</small></p>'; var feito = [];
  try { var rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function (r) { return r.unregister(); })); feito.push('serviço offline'); } catch (e) {}
  try { var ks = await caches.keys(); await Promise.all(ks.map(function (k) { return caches.delete(k); })); feito.push('cache'); } catch (e) {}
  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('vistoria_cbmpa') === 0) localStorage.removeItem(k); }); feito.push('dados salvos'); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  await new Promise(function (ok) { try { var r = indexedDB.deleteDatabase(DBN); r.onsuccess = function () { feito.push('fotos e histórico'); ok(); }; r.onerror = ok; r.onblocked = function () { area.innerHTML = '<div class="n">Feche as outras abas ou janelas deste aplicativo e recarregue esta página para concluir a limpeza.</div>'; ok(); }; } catch (e) { ok(); } });
  area.innerHTML = '<div class="n"><b>Encerrado.</b> Os dados antigos foram removidos deste aparelho (' + feito.join(', ') + '). Você já pode fechar esta página.</div>';
}

/* ---------------- tela ---------------- */
async function iniciar() {
  if (NOVO_ENDERECO) { var n = $('novo'); n.style.display = 'block'; n.innerHTML = 'Nova versão: <a href="' + esc(NOVO_ENDERECO) + '">' + esc(NOVO_ENDERECO) + '</a>'; }
  var area = $('area');
  try { await carregar(); } catch (e) { VIS = []; }
  var nv = VIS.filter(function (v) { return !v.soSoltas; }).length, nf = VIS.reduce(function (s, v) { return s + v.fotos.length; }, 0);
  if (!nv && !nf) { await apagarTudo(); return; }
  var pasta = !!window.showDirectoryPicker;
  area.innerHTML = '<div class="n">Há <b>' + nv + ' vistoria(s)</b> e <b>' + nf + ' foto(s)</b> guardadas neste aparelho. <b>Salve antes de continuar:</b> depois de salvar, o aparelho é encerrado e os dados antigos são apagados. Esta página fica disponível por tempo limitado.</div>' +
    (nv ? '<button class="b or" id="bPdf">📄 Salvar as vistorias (PDF)</button><p class="s" id="sPdf"></p>' : '') +
    (nf ? '<button class="b vd" id="bFotos">📷 Salvar as fotos (arquivos separados)</button><p class="s" id="sFotos"></p>' : '') +
    '<div class="n" style="font-size:14px">' + (pasta ? 'Na primeira vez o navegador pede para <b>escolher uma pasta</b>: escolha a mesma para os dois botões. Os PDFs vão para a subpasta Relatorios e as fotos para Fotos, cada uma com o nome de sempre.' : 'Este navegador não deixa escolher pasta: os PDFs e as fotos (em arquivos ZIP) serão baixados para a pasta Downloads.') + '</div>' +
    (pasta ? '<button class="l" id="bZip">Prefiro baixar em ZIP / Downloads</button>' : '') + '<div id="fim" style="display:none"></div>';
  if ($('bPdf')) $('bPdf').onclick = salvarPdfs; if ($('bFotos')) $('bFotos').onclick = salvarFotos;
  if ($('bZip')) $('bZip').onclick = function () { ST.modoZip = true; ST.pasta = null; $('bZip').style.display = 'none'; };
  window.__desligamento = { vis: function () { return VIS; }, pdf: pdfDaVistoria, nomes: nomesFotos, zip: montarZip, apagar: apagarTudo };
}
iniciar();
})();
</script>
